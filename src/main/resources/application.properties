spring.application.name=UTETra
server.port=8080
server.servlet.encoding.charset=UTF-8
server.servlet.encoding.force=true

# Thong tin bi mat (DB, JWT, Cloudinary, VNPay) nam trong file application-local.properties
# o thu muc goc du an (da .gitignore). Xem application-local.properties.example.
spring.config.import=optional:file:./application-local.properties

# JSP
spring.mvc.view.prefix=/WEB-INF/views/
spring.mvc.view.suffix=.jsp

# SQL Server (co the ghi de bang application-local.properties hoac bien moi truong)
spring.datasource.url=jdbc:sqlserver://${DB_HOST:localhost}:${DB_PORT:1433};databaseName=${DB_NAME:utetra};encrypt=true;trustServerCertificate=true
spring.datasource.username=${DB_USERNAME:utetra_app}
spring.datasource.password=${DB_PASSWORD:}

# Bang duoc tao boi database/schema.sql; Hibernate chi kiem tra entity co khop bang hay khong
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.properties.hibernate.use_nationalized_character_data=true
spring.jpa.show-sql=false
# Cho phep JSP doc quan he lazy trong luc render
spring.jpa.open-in-view=true
spring.sql.init.mode=never

# JWT: khoa ky nam trong application-local.properties (JWT_SECRET, toi thieu 32 ky tu)
jwt.secret=${JWT_SECRET:}
jwt.expiration-minutes=480
# Dat true khi chay HTTPS that (cookie chi gui qua HTTPS)
app.cookie.secure=false

# VNPay sandbox. TmnCode va HashSecret phai dat trong application-local.properties, khong commit gia tri that.
vnpay.tmn-code=${VNPAY_TMN_CODE:}
vnpay.hash-secret=${VNPAY_HASH_SECRET:}
vnpay.pay-url=https://sandbox.vnpayment.vn/paymentv2/vpcpay.html
vnpay.return-url=${VNPAY_RETURN_URL:http://localhost:8080/payments/vnpay/return}
vnpay.expire-minutes=15

# Upload anh: server nhan toi da 5MB de co the bao loi than thien; ung dung gioi han anh san pham 2MB.
# resolve-lazily: loi qua kich thuoc duoc xu ly trong controller thay vi tra trang loi 500
spring.servlet.multipart.max-file-size=5MB
spring.servlet.multipart.max-request-size=6MB
spring.servlet.multipart.resolve-lazily=true

# Cloudinary (luu anh san pham): dat cloudinary.cloud-name, cloudinary.api-key, cloudinary.api-secret
# trong application-local.properties. De trong thi van chay, chi khong upload duoc anh.
